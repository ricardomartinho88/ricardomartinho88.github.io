<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Troca de Figurinhas</title>

<style>
    :root {
        --bg: #f7f7f7;
        --text: #222;
        --card: #fff;
        --border: #ccc;
        --button: #0078ff;
        --button-hover: #005fcc;
    }

    body.dark {
        --bg: #1e1e1e;
        --text: #eaeaea;
        --card: #2a2a2a;
        --border: #444;
        --button: #00aaff;
        --button-hover: #0088cc;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        transition: 0.3s;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 10px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-bottom: 10px;
        background: var(--card);
        color: var(--text);
    }

    .btn {
        padding: 12px 20px;
        background: var(--button);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
        margin-right: 10px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        transition: 0.2s;
    }

    .btn:hover {
        background: var(--button-hover);
        transform: translateY(-2px);
    }

    #resultado {
        background: var(--card);
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid var(--border);
        white-space: pre-wrap;
    }

    #themeToggle {
        float: right;
        margin-top: -10px;
    }

    .credito {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 13px;
        opacity: 0.7;
        color: var(--text);
    }
</style>
</head>
