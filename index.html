<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Troca de Figurinhas</title>

<style>
    :root {
        --bg: #f7f7f7;
        --text: #222;
        --card: #fff;
        --border: #ccc;
        --button: #0078ff;
        --button-hover: #005fcc;
    }

    body.dark {
        --bg: #1e1e1e;
        --text: #eaeaea;
        --card: #2a2a2a;
        --border: #444;
        --button: #00aaff;
        --button-hover: #0088cc;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        transition: 0.3s;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 10px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-bottom: 10px;
        background: var(--card);
        color: var(--text);
    }

    .btn {
        padding: 12px 20px;
        background: var(--button);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
        margin-right: 10px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        transition: 0.2s;
    }

    .btn:hover {
        background: var(--button-hover);
        transform: translateY(-2px);
    }

    #resultado {
        background: var(--card);
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid var(--border);
        white-space: pre-wrap;
    }

    #themeToggle {
        float: right;
        margin-top: -10px;
    }
</style>
</head>

<body>

<button id="themeToggle" class="btn" onclick="toggleTheme()">Alternar Tema</button>

<h1>App de Troca de Figurinhas</h1>

<h2>1. Sua lista de figurinhas que faltam (salva automaticamente)</h2>
<textarea id="minhaLista" placeholder="Cole aqui sua lista..."></textarea>
<button class="btn" onclick="salvarMinhaLista()">Salvar Minha Lista</button>

<h2>2. Lista de repetidas da outra pessoa</h2>
<textarea id="listaOutro" placeholder="Cole aqui a lista da outra pessoa..."></textarea>
<button class="btn" onclick="cruzarListas()">Cruzar Listas</button>

<h2>Resultado</h2>
<div id="resultado">Nenhum resultado ainda.</div>
<button class="btn" onclick="copiarWhatsApp()">Copiar para WhatsApp</button>

<script>
function parseList(text) {
    const lines = text.split("\n");
    const result = {};

    for (let line of lines) {
        if (!line.includes(":")) continue;

        const [country, numbers] = line.split(":");
        const cleanNumbers = numbers
            .replace(/\(.*?\)/g, "")
            .split(",")
            .map(n => parseInt(n))
            .filter(n => !isNaN(n));

        result[country.trim().toUpperCase()] = cleanNumbers;
    }

    return result;
}

function salvarMinhaLista() {
    const texto = document.getElementById("minhaLista").value;
    localStorage.setItem("minhaListaFigurinhas", texto);
    alert("Lista salva!");
}

function carregarMinhaLista() {
    const salva = localStorage.getItem("minhaListaFigurinhas");
    if (salva) {
        document.getElementById("minhaLista").value = salva;
    }
}

function cruzarListas() {
    const minhaLista = parseList(document.getElementById("minhaLista").value);
    const listaOutro = parseList(document.getElementById("listaOutro").value);

    let resultado = "Figurinhas que você precisa e ele tem:\n\n";
    let encontrou = false;

    for (let country in listaOutro) {
        if (!minhaLista[country]) continue;

        const match = listaOutro[country].filter(n =>
            minhaLista[country].includes(n)
        );

        if (match.length > 0) {
            encontrou = true;
            resultado += `${country}: ${match.join(", ")}\n`;
        }
    }

    if (!encontrou) {
        resultado = "Nenhuma figurinha encontrada.";
    }

    document.getElementById("resultado").innerText = resultado;
}

function copiarWhatsApp() {
    const texto = document.getElementById("resultado").innerText;
    navigator.clipboard.writeText(texto);
    alert("Copiado! Agora é só colar no WhatsApp.");
}

function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("temaFigurinhas", document.body.classList.contains("dark") ? "dark" : "light");
}

function carregarTema() {
    const tema = localStorage.getItem("temaFigurinhas");
    if (tema === "dark") {
        document.body.classList.add("dark");
    }
}

carregarMinhaLista();
carregarTema();
</script>
    
<div class="credito">criado por: Ricardo Martinho</div>

</body>
</html>
